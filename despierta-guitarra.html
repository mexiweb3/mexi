<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despierta — guitarra</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d1d1d;
    --accent: #ee5a1f;
    --muted: #6b6b6b;
    --line: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    line-height: 1.55;
  }
  h1 {
    font-size: 2.25rem;
    margin: 0 0 .35rem;
    letter-spacing: -.01em;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 1rem;
  }
  h2 {
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--muted);
    margin: 2.5rem 0 1rem;
    font-weight: 600;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Notation toggle */
  .notation {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: .5rem 0 1rem;
    user-select: none;
  }
  .notation button {
    background: transparent;
    border: 0;
    padding: .45rem 1rem;
    font: inherit;
    font-size: .9rem;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .notation button.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .notation button:not(.active):hover { background: #f7f7f7; }

  /* Chord legend at top */
  .chord-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1rem;
    align-items: end;
    margin: 1rem 0 2rem;
  }
  .chord { text-align: center; }
  .chord .name {
    color: var(--accent);
    font-weight: 800;
    font-size: 1.4rem;
    margin-bottom: .35rem;
  }

  /* Song body — chord above each segment of lyric */
  .song { margin-top: 1rem; }
  .line {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    margin: 1.75rem 0;
  }
  .seg {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .seg .name {
    color: var(--accent);
    font-weight: 800;
    font-size: 1rem;
    line-height: 1;
    margin-bottom: 3px;
  }
  .seg svg {
    display: block;
    margin-bottom: 4px;
    transform: scaleX(-1);  /* mirror horizontally */
  }
  .seg .text {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.1rem;
    white-space: pre;
    color: var(--ink);
    line-height: 1.3;
    align-self: flex-start;
  }
  .seg.empty .name,
  .seg.empty svg { visibility: hidden; }
  .chord svg { transform: scaleX(-1); }

  /* Sources footer */
  .sources {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .9rem;
  }
  .sources ul { padding-left: 1.25rem; margin: .5rem 0; }

  @media print {
    body { max-width: none; padding: .75rem; }
    .seg { min-height: 110px; }
    .seg .diagram { height: 90px; }
  }
  @media (max-width: 720px) {
    .chord-row { grid-template-columns: repeat(4, 1fr); }
    .seg .text { font-size: .9rem; }
    .seg { min-height: 105px; }
    .seg .diagram { height: 85px; }
  }
  @media (max-width: 480px) {
    .chord-row { grid-template-columns: repeat(3, 1fr); }
    .seg .text { font-size: .8rem; }
  }
</style>
</head>
<body>

<h1>Despierta</h1>
<p class="subtitle">Bolero de Gabriel Ruíz · Pedro Infante · tono Do mayor</p>

<div class="notation" role="tablist" aria-label="Notación de acordes">
  <button id="btn-anglo"  class="active" type="button">C D E</button>
  <button id="btn-doremi" type="button">Do Re Mi</button>
</div>

<h2>Acordes que usa la canción</h2>
<div class="chord-row" id="chord-row"></div>

<h2>Letra con acordes</h2>
<div class="song" id="song"></div>

<div class="sources">
  <strong>Fuentes y referencia</strong>
  <ul>
    <li>Tutorial: <a href="https://youtu.be/rjN7LLkAZlI">J M Cruz — Despierta, Armonía en Guitarra</a></li>
    <li>Letra completa: <a href="https://chords.lacuerda.net/pedro_infante/despierta">LaCuerda</a> · <a href="https://www.cifraclub.com/pedro-infante/despierta/">Cifra Club</a></li>
  </ul>
</div>

<script>
  const CHORDS = {
    C:   { frets: [-1,3,2,0,1,0],   fingers: [0,3,2,0,1,0] },
    C7:  { frets: [-1,3,2,3,1,0],   fingers: [0,3,2,4,1,0] },
    Dm:  { frets: [-1,-1,0,2,3,1],  fingers: [0,0,0,2,3,1] },
    F:   { frets: [1,3,3,2,1,1],    fingers: [1,3,4,2,1,1], barre: { fret: 1, from: 6, to: 1 } },
    Fm:  { frets: [1,3,3,1,1,1],    fingers: [1,3,4,1,1,1], barre: { fret: 1, from: 6, to: 1 } },
    "G#":{ frets: [4,6,6,5,4,4],    fingers: [1,3,4,2,1,1], barre: { fret: 4, from: 6, to: 1 } },
    G7:  { frets: [3,2,0,0,0,1],    fingers: [3,2,0,0,0,1] },
  };

  function drawChord(name, size = "large") {
    const c = CHORDS[name];
    if (!c) return "";
    const { frets, fingers, barre } = c;
    const scale = size === "small" ? 0.65 : 1;
    const W = 110 * scale, H = 140 * scale;
    const left = 18 * scale, top = 30 * scale;
    const gridW = 74 * scale, gridH = 88 * scale;
    const cols = 5, rows = 4;
    const cellW = gridW / cols, cellH = gridH / rows;

    const playedFrets = frets.filter(f => f > 0);
    const minFret = playedFrets.length ? Math.min(...playedFrets) : 1;
    const maxFret = playedFrets.length ? Math.max(...playedFrets) : 1;
    const baseFret = (maxFret > 4) ? minFret : 1;

    const fontFret = 10 * scale, fontDot = 10 * scale, fontMark = 11 * scale;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-label="${name}">`;

    for (let i = 0; i <= rows; i++) {
      const y = top + i * cellH;
      const sw = (baseFret === 1 && i === 0) ? 4 * scale : 1.4 * scale;
      svg += `<line x1="${left}" y1="${y}" x2="${left+gridW}" y2="${y}" stroke="#1d1d1d" stroke-width="${sw}"/>`;
    }
    for (let i = 0; i <= cols; i++) {
      const x = left + i * cellW;
      svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${top+gridH}" stroke="#1d1d1d" stroke-width="${1.2 * scale}"/>`;
    }

    if (baseFret > 1) {
      svg += `<text x="${left + gridW + 6 * scale}" y="${top + cellH/2 + 4 * scale}" font-size="${fontFret}" fill="#9a9a9a">${baseFret}ª</text>`;
    }

    frets.forEach((f, i) => {
      const x = left + (5 - i) * cellW;
      const y = top + gridH + 14 * scale;
      if (f === -1) {
        svg += `<text x="${x}" y="${y}" text-anchor="middle" font-size="${fontMark}" fill="#1d1d1d">×</text>`;
      } else {
        svg += `<circle cx="${x}" cy="${y - 3 * scale}" r="${3.2 * scale}" fill="none" stroke="#1d1d1d" stroke-width="${1.3 * scale}"/>`;
      }
    });

    if (barre) {
      const y = top + (barre.fret - baseFret + 0.5) * cellH;
      const xFrom = left + (6 - barre.from) * cellW;
      const xTo   = left + (6 - barre.to) * cellW;
      const xL = Math.min(xFrom, xTo) - 9 * scale;
      const xR = Math.max(xFrom, xTo) + 9 * scale;
      svg += `<rect x="${xL}" y="${y - 8 * scale}" width="${xR - xL}" height="${16 * scale}" rx="${8 * scale}" fill="#1d1d1d"/>`;
    }

    frets.forEach((f, i) => {
      if (f > 0) {
        const x = left + (5 - i) * cellW;
        const y = top + (f - baseFret + 0.5) * cellH;
        const finger = fingers[i];
        const onBarre = barre && barre.fret === f && finger === 1;
        if (!onBarre) {
          svg += `<circle cx="${x}" cy="${y}" r="${9 * scale}" fill="#1d1d1d"/>`;
          if (finger > 0) {
            svg += `<text x="${x}" y="${y + 3.5 * scale}" text-anchor="middle" font-size="${fontDot}" font-weight="700" fill="#ffffff">${finger}</text>`;
          }
        }
      }
    });

    svg += `</svg>`;
    return svg;
  }

  // Notation translation: anglo ↔ Do Re Mi
  const TO_DOREMI = {
    C: "Do", D: "Re", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si",
  };
  function translateChord(name) {
    if (state.notation === "anglo") return name;
    // Match leading note (one letter, optional # or b) + suffix
    const m = name.match(/^([A-G])([#b]?)(.*)$/);
    if (!m) return name;
    const root = TO_DOREMI[m[1]] || m[1];
    const accidental = m[2];
    let rest = m[3];
    if (rest === "m") rest = "m";
    return root + accidental + rest;
  }

  let state = { notation: "anglo" };

  function render() {
    // Top legend
    const order = ["C", "C7", "Dm", "F", "Fm", "G#", "G7"];
    document.getElementById("chord-row").innerHTML = order.map(n => `
      <div class="chord">
        <div class="name">${translateChord(n)}</div>
        ${drawChord(n, "large")}
      </div>
    `).join("");

    // Song
    document.getElementById("song").innerHTML = SONG.map(line => `
      <div class="line">
        ${line.map(seg => `
          <div class="seg ${seg.chord ? "" : "empty"}">
            <div class="name">${seg.chord ? translateChord(seg.chord) : "·"}</div>
            ${seg.chord ? drawChord(seg.chord, "small") : `<svg width="71" height="91" aria-hidden="true"></svg>`}
            <div class="text">${seg.text}</div>
          </div>
        `).join("")}
      </div>
    `).join("");
  }

  document.getElementById("btn-anglo").addEventListener("click", () => {
    state.notation = "anglo";
    document.getElementById("btn-anglo").classList.add("active");
    document.getElementById("btn-doremi").classList.remove("active");
    render();
  });
  document.getElementById("btn-doremi").addEventListener("click", () => {
    state.notation = "doremi";
    document.getElementById("btn-doremi").classList.add("active");
    document.getElementById("btn-anglo").classList.remove("active");
    render();
  });

  // Song lines: each segment = { chord (or null), text }
  // Lyric content as supplied by the user (Despierta, Pedro Infante).
  const SONG = [
    [
      { chord: "C",  text: "Despierta, dulce amor de mi " },
      { chord: "G7", text: "vida" },
    ],
    [
      { chord: "Dm", text: "despierta, " },
      { chord: "G7", text: "si te encuentras " },
      { chord: "C",  text: "dormida" },
    ],
    [
      { chord: null, text: "escucha mi voz vibrar bajo tu " },
      { chord: "G7", text: "ventana" },
    ],
    [
      { chord: null, text: "en esta " },
      { chord: "Dm", text: "cancion te vengo a entregar " },
      { chord: "G7", text: "el " },
      { chord: "C",  text: "alma" },
    ],
    [
      { chord: "C7", text: "Perdona que interrumpa " },
      { chord: "F",  text: "tu sueño" },
    ],
    [
      { chord: "Fm", text: "pero no " },
      { chord: "C",  text: "pude mas y esta noche te " },
      { chord: "G7", text: "vine a decir" },
    ],
    [
      { chord: "C",   text: "te quiero, " },
      { chord: "G#",  text: "te quiero, " },
      { chord: "C",   text: "te adoro" },
    ],
  ];

  render();
</script>

</body>
</html>
